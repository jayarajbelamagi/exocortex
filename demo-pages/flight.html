<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AeroSky Flight Confirmation - Seat 14B</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; color: #1e293b; padding: 40px; }
    .ticket { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; border-top: 5px solid #0284c7; }
    h1 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
    .detail { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
    .highlight { font-weight: bold; color: #0284c7; }
    .alert-banner { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="ticket">
    <h1>✈️ AeroSky Confirmed Itinerary</h1>
    <div class="detail"><span>Passenger:</span> <strong>Alex Mercer</strong></div>
    <div class="detail"><span>Departure:</span> <span>18:15 PM (New York JFK)</span></div>
    <div class="detail"><span>Arrival:</span> <span class="highlight">22:45 PM (London Heathrow)</span></div>
    <div class="detail"><span>Total Paid:</span> <span class="highlight">$640</span></div>
    <div class="alert-banner">
      ✓ Flight confirmed. Estimated luggage collection time: 23:20 PM.
    </div>
  </div>
</body>
</html>
